name: ai-notes-test
services:
  db:
    image: ai-notes-postgres:local
    build: ./ops/postgres
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_test"]
      interval: 2s
      timeout: 3s
      retries: 20
