name: M0 checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://notes:notes@localhost:5432/notes_test
      TEST_DATABASE_URL: postgresql+psycopg://notes:notes@localhost:5432/notes_test
      APP_ORIGIN: http://testserver
      RATE_LIMIT_REQUESTS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.lock
        working-directory: backend
      - run: alembic upgrade head && alembic check && pytest -q
        working-directory: backend
      - run: PYTHONPATH=. python scripts/export_openapi.py
        working-directory: backend
      - run: npm ci && npm run check:types && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.json
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose build
